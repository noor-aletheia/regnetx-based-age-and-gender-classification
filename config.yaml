dataset:
  path: "/app/mixed_data_v2"
  batch_size: 32
  num_workers: 4
  age_class_scheme: "8-class"

models:
  variants: ["regnetx_006", "regnetx_008", "regnetx_016"]
  pretrained: true
training:
  phase1:
    epochs: 20
    learning_rate: 1e-3
    weight_decay: 1e-4
    patience: 6
  phase2:
    epochs: 40
    learning_rate: 1e-5
    weight_decay: 5e-4
    patience: 10
  loss_type: "focal"  # Options: cross_entropy, focal
  
  # Optimizer settings
  optimizer: "AdamW"
  scheduler: "CosineAnnealingLR"
  scheduler_params:
    T_max: 40
    eta_min: 1e-6
  age_loss_weight: 1.0
  gender_loss_weight: 1.0
  class_weight_mode: "default"
  class_weight_power_alpha: 1.0
  loss_weights:
    age: null
    gender: null

augmentation:
  presets:
    strong:
      horizontal_flip: 0.5
      rotation: 20
      color_jitter:
        brightness: 0.4
        contrast: 0.4
        saturation: 0.4
        hue: 0.1
      random_resized_crop: true
      random_erasing: 0.25
    medium:
      horizontal_flip: 0.5
      rotation: 10
      color_jitter:
        brightness: 0.2
        contrast: 0.2
        saturation: 0.2
        hue: 0.05
      random_resized_crop: false
      random_erasing: 0.1
  train:
    age: strong
    gender: medium
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
  val_test:
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

# Output Configuration
output:
  models_dir: "/outputs/models"
  logs_dir: "/outputs/logs"

  tensorboard_dir: "/outputs/tensorboard"
  checkpoint_every: 5
  save_best_only: true

hardware:
  device: "cuda"
  mixed_precision: true
  compile_model: false

logging:
  log_dir: "outputs/logs"
  tensorboard_dir: "outputs/tensorboard"
  log_level: "INFO"
  enable_tensorboard: true
  save_checkpoint_every: 5
  simplify_onnx: true
  onnx_use_overall_similarity: true