dataset:
  path: "/workspace/expanded_merged_dataset"
  batch_size: 256
  num_workers: 4
  age_class_scheme: "4-class"

models:
  variants: ["regnet_200m", "regnet_400m", "regnet_600m", "regnet_800m", "regnet_1600m", "regnet_3200m", "regnet_6400m"]
  pretrained: true
training:
  phase1:
    epochs: 5
    learning_rate: 8e-5
    weight_decay: 1e-5
    patience: 5
  phase2:
    epochs: 25
    learning_rate: 2e-5
    weight_decay: 5e-6
    patience: 8
  loss_type: "focal"
  
  optimizer: "AdamW"
  scheduler: "CosineAnnealingLR"
  scheduler_params:
    T_max: 40
    eta_min: 1e-6
  age_loss_weight: 1.5
  gender_loss_weight: 1.0
  class_weight_mode: "power"
  class_weight_power_alpha: 2.3
  loss_weights:
    age: null
    gender: null

augmentation:
  mode:
    motion_blur:
      prob: 0.25
      blur_limit: [3, 7]
      angle: [0, 180]
    random_affine:
      degrees: 7
      translate: [0.03, 0.03]
      scale: [0.97, 1.03]
      shear: 5
    color_jitter:
      brightness: 0.1
      contrast: 0.25
      saturation: 0.1
      hue: 0.02
    horizontal_flip: 0.5
    sharpening:
      prob: 0.15
      intensity: 1.5
      radius: 2
      percent: 150
      threshold: 3
    clahe:
      prob: 0.15
      clip_limit: 2.0
      tile_grid_size: [8, 8]
  train:
    normalize:
      mean: [0.5, 0.5, 0.5]
      std: [0.5, 0.5, 0.5]
  val_test:
    normalize:
      mean: [0.5, 0.5, 0.5]
      std: [0.5, 0.5, 0.5]

output:
  models_dir: "/outputs/models"
  logs_dir: "/outputs/logs"

  tensorboard_dir: "/outputs/tensorboard"
  checkpoint_every: 5
  save_best_only: true

hardware:
  device: "cuda"
  mixed_precision: true
  compile_model: false

logging:
  log_dir: "outputs/logs"
  tensorboard_dir: "outputs/tensorboard"
  log_level: "INFO"
  enable_tensorboard: true
  save_checkpoint_every: 5