dataset:
  path: "/app/mixed_data_v2"
  batch_size: 64
  num_workers: 4
  age_class_scheme: "8-class"

models:
  variants: ["regnetx_006", "regnetx_008", "regnetx_016"]
  pretrained: true
training:
  phase1:
    epochs: 20
    learning_rate: 1e-3
    weight_decay: 1e-4
    patience: 6
  phase2:
    epochs: 40
    learning_rate: 1.5e-4
    weight_decay: 5e-4
    patience: 15
  loss_type: "focal"
  
  optimizer: "AdamW"
  scheduler: "CosineAnnealingLR"
  scheduler_params:
    T_max: 40
    eta_min: 1e-6
  age_loss_weight: 1.0
  gender_loss_weight: 1.0
  class_weight_mode: "default"
  class_weight_power_alpha: 1.0
  loss_weights:
    age: null
    gender: null

augmentation:
  presets:
    strong:
      # Spatial augmentations
      at_least_one_bbox_random_crop: 0.3
      d4_transform: 0.2
      
      # Blur effects (light intensity for face recognition)
      gaussian_blur:
        prob: 0.15
        blur_limit: [1, 3]
      defocus:
        prob: 0.1
        radius: [1, 2]
      motion_blur:
        prob: 0.1
        blur_limit: [3, 5]
      
      # Noise and quality degradation
      gaussian_noise:
        prob: 0.15
        var_limit: [10, 30]
      downscale:
        prob: 0.1
        scale_range: [0.7, 0.9]
      
      # Enhancement and color manipulation
      clahe:
        prob: 0.2
        clip_limit: [1, 2]
      to_gray:
        prob: 0.05
      
      # Geometric distortion
      grid_distortion:
        prob: 0.15
        distort_limit: 0.1
      
      # Standard augmentations (reduced since pre-augmented)
      rotation: 10
      color_jitter:
        brightness: 0.2
        contrast: 0.2
        saturation: 0.2
        hue: 0.05
      horizontal_flip: 0.5
      random_resized_crop: true
      random_erasing: 0.15
    medium:
      horizontal_flip: 0.5
      rotation: 10
      color_jitter:
        brightness: 0.2
        contrast: 0.2
        saturation: 0.2
        hue: 0.05
      random_resized_crop: false
      random_erasing: 0.1
  train:
    age: strong
    gender: strong
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
  val_test:
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

output:
  models_dir: "/outputs/models"
  logs_dir: "/outputs/logs"

  tensorboard_dir: "/outputs/tensorboard"
  checkpoint_every: 5
  save_best_only: true

hardware:
  device: "cuda"
  mixed_precision: true
  compile_model: false

logging:
  log_dir: "outputs/logs"
  tensorboard_dir: "outputs/tensorboard"
  log_level: "INFO"
  enable_tensorboard: true
  save_checkpoint_every: 5
  simplify_onnx: true
  onnx_use_overall_similarity: true
  onnx_dynamic_axes: false  